<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;background:#fff;border:1px solid #ece8df;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px -32px rgba(32,37,69,.35)">
  <button onClick="{{ onView }}" aria-label="{{ title }}" style="background:{{ headBg }};color:{{ headFg }};border:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-height:148px;position:relative;flex:none">
    <div style="padding:22px 22px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;box-sizing:border-box">
      <sc-if value="{{ hasDate }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:2px;min-width:64px">
          <span style="font-family:'Cormorant Garamond',serif;font-weight:700;font-size:{{ dateBig }};line-height:1;color:{{ headFg }}">{{ dateTop }}</span>
          <span style="font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:{{ headSub }}">{{ dateBottom }}</span>
        </div>
      </sc-if>
      <span style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:{{ headSub }};padding-top:4px">{{ typeLabel }}</span>
    </div>
    <div style="margin-top:auto;padding:0 22px 18px;display:flex">
      <span style="font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:{{ statusBg }};color:{{ statusColor }}">{{ statusLabel }}</span>
    </div>
  </button>

  <div style="padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;flex:1">
    <button onClick="{{ onView }}" style="background:none;border:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px">
      <span style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1.1;color:#202545;text-wrap:balance">{{ title }}</span>
      <span style="font-size:15px;line-height:1.6;color:#5a5a5a;text-wrap:pretty">{{ description }}</span>
    </button>

    <sc-if value="{{ hasSpeaker }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:12px;padding-top:2px">
        <sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}">
          <img src="{{ speakerPhoto }}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;display:block;flex:none">
        </sc-if>
        <sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ false }}">
          <div style="width:40px;height:40px;border-radius:50%;background:#F2ECB6;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;color:#202545;flex:none">{{ initials }}</div>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
          <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#85704A">{{ speakerRole }}</span>
          <span style="font-size:14px;font-weight:700;color:#202545;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ speaker }}</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ hasMeta }}" hint-placeholder-val="{{ true }}">
      <span style="font-size:13px;color:#7a7466;font-weight:600">{{ meta }}</span>
    </sc-if>

    <div style="margin-top:auto;padding-top:8px;display:flex;gap:10px;flex-wrap:wrap">
      <button onClick="{{ onCta }}" style="background:{{ ctaBg }};color:{{ ctaColor }};border:none;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;border-radius:999px;white-space:nowrap" style-hover="filter:brightness(1.06)">{{ cta }}</button>
      <button onClick="{{ onView }}" style="background:none;border:1px solid #e4dfd3;color:#202545;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;border-radius:999px;white-space:nowrap" style-hover="border-color:#B29B72">Details</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.p || {};
    return {
      ...p,
      hasMeta: !!(p.meta && String(p.meta).trim())
    };
  }
}
</script>
</body>
</html>
