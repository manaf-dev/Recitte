<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;border-radius:28px;display:flex;flex-direction:column;height:100%;box-sizing:border-box;font-family:'Manrope',sans-serif;font-size:17px;line-height:1.6;color:#262838;overflow:hidden;transition:transform .25s ease" style-hover="transform:translateY(-3px)">
  <div style="background:{{ p.headBg }};color:{{ p.headFg }};padding:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;min-height:140px">
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0">
      <span style="font-size:14px;font-weight:700;color:{{ p.headSub }}">{{ p.typeLabel }}</span>
      <span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:{{ p.headFg }}"><span style="width:10px;height:10px;border-radius:50%;background:{{ p.headSub }};flex:none;display:block"></span>{{ p.statusLabel }}</span>
    </div>
    <sc-if value="{{ p.hasDate }}" hint-placeholder-val="{{ true }}">
      <div style="background:#fff;color:#202545;border-radius:50%;width:88px;height:88px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
        <span style="font-family:'Cormorant Garamond',serif;font-size:{{ p.dateBig }};font-weight:700;line-height:1">{{ p.dateTop }}</span>
        <span style="font-size:14px;font-weight:700;color:#5d4e32;line-height:1.2">{{ p.dateBottom }}</span>
      </div>
    </sc-if>
  </div>
  <div style="padding:24px 24px 24px;display:flex;flex-direction:column;gap:14px;flex:1">
    <h3 style="margin:0"><button onClick="{{ p.onView }}" style="background:none;border:none;padding:0;text-align:left;cursor:pointer;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;line-height:1.05;color:#202545;text-wrap:balance" style-hover="color:#85704A">{{ p.title }}</button></h3>
    <p style="margin:0;color:#262838;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{ p.description }}</p>
    <sc-if value="{{ p.hasSpeaker }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px">
        <sc-if value="{{ p.hasPhoto }}" hint-placeholder-val="{{ false }}">
          <img src="{{ p.speakerPhoto }}" alt="{{ p.speaker }}" width="44" height="44" style="width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;flex:none">
        </sc-if>
        <sc-if value="{{ p.noPhoto }}" hint-placeholder-val="{{ false }}">
          <div style="width:44px;height:44px;border-radius:50%;flex:none;background:#F2ECB6;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:#202545">{{ p.initials }}</div>
        </sc-if>
        <span style="color:#262838;min-width:0"><strong style="color:#202545">{{ p.speaker }}</strong>, {{ p.speakerRole }}</span>
      </div>
    </sc-if>
    <span style="font-size:14px;font-weight:600;color:#5d584b">{{ p.meta }}</span>
    <div style="margin-top:auto;padding-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button onClick="{{ p.onCta }}" style="flex:1;min-width:0;background:{{ p.ctaBg }};color:{{ p.ctaColor }};border:none;padding:14px 18px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;border-radius:999px;min-height:50px;white-space:nowrap" style-hover="filter:brightness(1.08)">{{ p.cta }}</button>
      <button onClick="{{ p.onView }}" style="background:#E5E3DE;border:none;color:#202545;padding:14px 20px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;border-radius:999px;min-height:50px;white-space:nowrap" style-hover="background:#D8D6D0">Details</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:480},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
